# Benchmark manifest: every suite is pinned to an exact commit (verified 2026-10-19,
# see docs/literature/verified-sources.md). `restgen benchmark fetch` checks them out into
# benchmark/projects/suites/<suite>; `restgen benchmark verify` proves they are unchanged.
#
# Roles (analysis §6.2): development = method/prompt design, validation = parameter
# choice, evaluation = run only after the method is frozen. Everything stays
# "unassigned" until docs/EXPERIMENT_PROTOCOL.md is frozen, except the toy API.
# Category "artificial" results are always reported apart from "real" ones.

[suite.restgym]
kind = "services"
repository = "https://github.com/restgym/restgym.git"
commit = "f413a75923f849f7fd0edb74c7339390843385bf"
license = "Apache-2.0"
reference = "corradini2025restgym"
notes = "11 JVM APIs, Docker only; JaCoCo agent + mitmproxy. Comparable main group."

[suite.wfd]
kind = "services"
repository = "https://github.com/WebFuzzing/Dataset.git"
commit = "915859080da033fc36feae54bab3ad4a7b04e872"
license = "Apache-2.0 (SUTs keep their own licences)"
reference = "sahin2025wfd"
notes = "Formerly EMB. REST/GraphQL/RPC; count only REST SUTs; versions of one project are not independent projects."

[suite.wafp]
kind = "services"
repository = "https://github.com/schemathesis/web-api-fuzzing-project.git"
commit = "4f9d9614dafb06ea7d469a8fc9de230c1f152bdd"
license = "MIT"
reference = "hatfielddodds2022semantics"
notes = "Python/JS/Go/Rust targets of the ICSE 2022 study; docker-compose per target; last push 2023, installability unchecked."

[suite.restestbench]
kind = "requirements"
repository = "https://github.com/casablancahotelsoftware/RESTestBench.git"
commit = "4decc1e36ea3dd41b64ce3e3ac6a85bc72df36ae"
license = "AGPL-3.0"
reference = "kogler2026restestbench"
notes = "FastAPI template, NestJS realworld, .NET TodoApp; NL requirements + validated mutants."

[suite.prab]
kind = "specs"
repository = "https://github.com/alixdecr/PRAB.git"
commit = "9312e96ab84c309b623fa3c7f027b85a9e9d4ffd"
license = "none (no LICENSE file)"
reference = "decrop2025prab"
notes = "OpenAPI documents of public APIs only: schema diversity, never server coverage."

[suite.schemathesis-examples]
kind = "services"
repository = "https://github.com/schemathesis/schemathesis.git"
commit = "4eeb7ebf9234e6b087ebf0a0e643e4eb39cffddc"
license = "MIT"
reference = "hatfielddodds2026schemathesis"
notes = "Teaching APIs shipped with Schemathesis; development only."

[service.booking]
suite = "schemathesis-examples"
language = "python"
framework = "fastapi"
category = "artificial"
role = "development"
openapi = "/openapi.json"
health = "/openapi.json"
headers = { Authorization = "Bearer secret-token" }
notes = "Has a deliberate KeyError on unknown room_type (500)."

[service.booking.launch]
kind = "command"
workdir = "examples/booking"
argv = ["{python}", "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "{port}"]
requirements = ["fastapi==0.143.0", "uvicorn==0.54.0"]  # versions the example ran with (2026-10-09)

[service.booking.coverage]
kind = "coveragepy"
include = ["."]

# ---------------------------------------------------------------------------------------
# OPTIONAL JVM ROUTE (not the main benchmark: owner decision 2026-10-21, Python first).
# WFD/EMB v4.3.0: the five services of the EvoMaster study (Arcuri, TOSEM 2019, Table 1).
# Launch arguments are those of WFD's own dockerfiles/<service>.dockerfile, run on the JVM
# directly (no Docker). Coverage = the service's own packages inside its SUT jar
# (JaCoCo 0.8.12 shipped with WFD); third-party libraries are excluded.
# Auth headers: the public test users of WFD's auth/<service>-auth.yaml (one role, the
# same for every tool).

[service.features-service]
suite = "wfd"
language = "java"
framework = "spring-boot"
category = "real"
role = "unassigned"
openapi = "file:openapi-swagger/features-service.json"
health = "/"
health_any_status = true

[service.features-service.launch]
kind = "jvm"
jdk = "8"
jar = "jdk_8_maven/cs/rest/original/features-service/target/features-service-sut.jar"
jvm_args = ["-Dspring.datasource.url=jdbc:h2:mem:testdb", "-Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect", "-Dspring.datasource.username=sa", "-Dspring.datasource.password"]
args = ["--server.port={port}"]
build_root = "jdk_8_maven"
build_module = "cs/rest/original/features-service"

[service.features-service.coverage]
kind = "jacoco"
agent = "jacoco/jacocoagent.jar"
cli = "jacoco/jacococli.jar"
classes = ["jdk_8_maven/cs/rest/original/features-service/target/features-service-sut.jar"]
include = ["org/javiermf/features"]

[service.catwatch]
suite = "wfd"
language = "java"
framework = "spring-boot"
category = "real"
role = "unassigned"
openapi = "file:openapi-swagger/catwatch.json"
health = "/"
health_any_status = true

[service.catwatch.launch]
kind = "jvm"
jdk = "8"
jar = "jdk_8_maven/cs/rest/original/catwatch/catwatch-backend/target/catwatch-sut.jar"
jvm_args = ["-Dserver.port={port}", "-Dspring.datasource.url=jdbc:h2:mem:testdb", "-Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect", "-Dspring.datasource.username=sa", "-Dspring.datasource.password"]
build_root = "jdk_8_maven"
build_module = "cs/rest/original/catwatch/catwatch-backend"

[service.catwatch.coverage]
kind = "jacoco"
agent = "jacoco/jacocoagent.jar"
cli = "jacoco/jacococli.jar"
classes = ["jdk_8_maven/cs/rest/original/catwatch/catwatch-backend/target/catwatch-sut.jar"]
include = ["org/zalando/catwatch"]

[service.proxyprint]
suite = "wfd"
language = "java"
framework = "spring-boot"
category = "real"
role = "unassigned"
openapi = "file:openapi-swagger/proxyprint.json"
health = "/"
health_any_status = true
headers = { Authorization = "Basic bWFzdGVyOjEyMzQ=" }  # WFD auth: "admin" (master:1234)
notes = "Fails at startup outside Docker: DocumentsConfig needs a writable documents path (not fixed)."

[service.proxyprint.launch]
kind = "jvm"
jdk = "8"
jar = "jdk_8_maven/cs/rest/original/proxyprint/target/proxyprint-sut.jar"
jvm_args = ["-Dspring.datasource.url=jdbc:h2:mem:testdb", "-Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect", "-Dspring.datasource.username=sa", "-Dspring.datasource.password", "-Dspring.jpa.show-sql=false", "-Dspring.jpa.hibernate.ddl-auto=create-drop", "-Xmx4G"]
args = ["--server.port={port}"]
build_root = "jdk_8_maven"
build_module = "cs/rest/original/proxyprint"

[service.proxyprint.coverage]
kind = "jacoco"
agent = "jacoco/jacocoagent.jar"
cli = "jacoco/jacococli.jar"
classes = ["jdk_8_maven/cs/rest/original/proxyprint/target/proxyprint-sut.jar"]
include = ["io/github/proxyprint"]

[service.rest-news]
suite = "wfd"
language = "kotlin"
framework = "spring-boot"
category = "artificial"
role = "unassigned"
openapi = "file:openapi-swagger/rest-news.json"
health = "/"
health_any_status = true
notes = "Teaching example (WFD lists it under artificial/)."

[service.rest-news.launch]
kind = "jvm"
jdk = "8"
jar = "jdk_8_maven/cs/rest/artificial/news/target/rest-news-sut.jar"
args = ["--server.port={port}"]
build_root = "jdk_8_maven"
build_module = "cs/rest/artificial/news"

[service.rest-news.coverage]
kind = "jacoco"
agent = "jacoco/jacocoagent.jar"
cli = "jacoco/jacococli.jar"
classes = ["jdk_8_maven/cs/rest/artificial/news/target/rest-news-sut.jar"]
include = ["org/tsdes"]

[service.scout-api]
suite = "wfd"
language = "java"
framework = "dropwizard"
category = "real"
role = "unassigned"
openapi = "file:openapi-swagger/scout-api.json"
health = "/api"
health_any_status = true
headers = { Authorization = "ApiKey administrator" }  # WFD auth: "administrator"

[service.scout-api.launch]
kind = "jvm"
jdk = "8"
# runs next to its config (scout_api_evomaster.yml) and init_db.sql, as in WFD's dockerfile
workdir = "scripts/dockerize/data/additional_files/scout-api"
jar = "jdk_8_maven/cs/rest/original/scout-api/api/target/scout-api-sut.jar"
jvm_args = ["-Ddw.server.connector.port={port}"]
args = ["server", "scout_api_evomaster.yml"]
build_root = "jdk_8_maven"
build_module = "cs/rest/original/scout-api/api"

[service.scout-api.coverage]
kind = "jacoco"
agent = "jacoco/jacocoagent.jar"
cli = "jacoco/jacococli.jar"
classes = ["jdk_8_maven/cs/rest/original/scout-api/api/target/scout-api-sut.jar"]
include = ["se/devscout"]
