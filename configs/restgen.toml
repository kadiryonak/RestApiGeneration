# restgen base configuration (benchmark + evaluation infrastructure).
# Values are placeholders until docs/EXPERIMENT_PROTOCOL.md is frozen.

[paths]
benchmark_manifest = "configs/benchmark.toml"
benchmark_dir = "benchmark/projects"
results_dir = "results"

[budget]
# Schemathesis benchmarking guide: bound runs by the clock (--max-time).
max_time_seconds = 60
max_examples = 100
request_timeout_seconds = 10.0

[repetitions]
# Schemathesis benchmarking guide: >= 5 seeds, report the median.
seeds = [42, 43, 44, 45, 46]

[evaluation]
success_status_min = 200
success_status_max = 299
server_error_min = 500
rerun_count = 3

[proxy]
# response bodies up to this size are stored whole (response-property coverage needs them)
max_body_bytes = 65536
redact_headers = ["authorization", "cookie", "set-cookie", "x-api-key"]

[tools.schemathesis]
executable = "baselines/schemathesis/.venv/bin/schemathesis"
extra_args = ["--continue-on-failure", "--no-shrink", "--suppress-health-check", "all"]

[tools.hypothesis]
python = "baselines/.venvs/hypothesis/bin/python"

[tools.evomaster]
# Release v6.2.0 (tag commit efad6f2bd7ff0025852a6203d307303c568e763a), fetched by `make tools`.
jar = "baselines/evomaster/releases/6.2.0/evomaster.jar"
java = "java"
python = "baselines/evomaster/.venv/bin/python"
# Black-box mode, Python output. MIO/SMARTS default search; one test file.
extra_args = ["--testSuiteSplitType", "NONE"]

[method.dabc_hs]
# Sahin & Akay (2021) tuning winner: PS=50, limit=10, change=5, reset=5 and
# a cycling SizeFactor set. These remain explicit so ablations never change code.
population_size = 50
limit = 10
archive_size = 10
mutation_rate = 0.3333333333333333
smart_sampling_rate = 0.6
mutation_threshold = 500
min_mutations = 1
max_mutations = 10
size_factors = [0.25, 0.75, 0.5]
change_number = 5
reset_number = 5
max_test_actions = 10

[toolchain]
# JVM services (WFD/EMB) are built and run with pinned tools inside .tools/ (`make toolchain`).
maven = ".tools/maven/apache-maven-3.9.16"
maven_repo = ".tools/m2"
# Interpreters for service venvs (e.g. Python 3.9 for WAFP targets) are downloaded by uv
# into this project folder; the user's global uv settings are not touched.
python_dir = ".tools/python"

[toolchain.jdks]
"8" = ".tools/jdk/jdk8u504-b01"  # Temurin 8u504-b01
