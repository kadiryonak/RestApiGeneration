[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "restgen"
version = "0.1.0"
description = "Hybrid Artificial Bee Colony (ABC) + LLM approach for REST APIs (thesis research prototype)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kadir Yönak" }]
# Runtime dependencies are added together with the code that needs them.
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Enable once src/restgen/cli.py exists:
# [project.scripts]
# restgen = "restgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/restgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests that touch the filesystem, subprocesses, Docker or benchmark services",
    "network: tests that call a real LLM endpoint",
]

[tool.coverage.run]
source = ["restgen"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# generated artefacts are archived verbatim, exactly as they were measured
extend-exclude = ["results", "benchmark", "schemathesis", "hypothesis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["restgen", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["restgen"]
